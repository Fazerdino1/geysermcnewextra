name: ${name}
version: ${version}
authors: ["LetsGoAway", "CrossPlayMC"]
description: "Java Edition features for Bedrock players on CrossPlayMC (based on the MIT project by LetsGoAway)"
main: fr.crossplaymc.geysermcnewextra.spigot.GeyserMCNewExtraSpigot
api-version: '1.16'
depend:
  - Geyser-Spigot
softdepend:
  - packetevents
commands:
  geysermcnewextra:
    description: Open the GeyserMCNewExtra menu.
    usage: /<command>
    aliases:
      - ge
  platformlist:
    description: Shows a player list including everyone's platforms.
    usage: /<command>
    aliases:
      - pl
      - platforms
  playerlist:
    description: Shows the Java Tab Player List menu for Bedrock Edition Players.
    usage: /<command>
    aliases:
      - l
      - players
      - listplayers
      - tab
      - tablist
  emotechat:
    description: Toggles Bedrock Player emote chat for Java Players.
    usage: /<command>
    aliases:
      - muteemotechat
      - unmuteemotechat