name: Build

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Checks gradle-wrapper.jar against Gradle's published checksums, and caches dependencies
      - uses: gradle/actions/setup-gradle@v4

      - name: Build all modules and run the tests
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: GeyserMCNewExtra-${{ github.sha }}
          path: |
            spigot/build/libs/GeyserMCNewExtra-Spigot.jar
            velocity/build/libs/GeyserMCNewExtra-Velocity.jar
            bungee/build/libs/GeyserMCNewExtra-BungeeCord.jar
            extension/build/libs/GeyserMCNewExtra-Extension.jar
          if-no-files-found: error
