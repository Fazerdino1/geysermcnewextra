name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The tag must be "v" + the version in gradle.properties, so a release never ships
      # jars that report another version
      - name: Check the tag matches the project version
        run: |
          version=$(grep -E '^version *=' gradle.properties | sed -E 's/^version *= *//')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match gradle.properties version $version"
            exit 1
          fi

      - name: Build all modules and run the tests
        run: ./gradlew build --no-daemon

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Versions with a pre-release part (e.g. 2.1.0-alpha.1) are published as pre-releases
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "GeyserMCNewExtra ${GITHUB_REF_NAME#v}" \
            --generate-notes $prerelease \
            spigot/build/libs/GeyserMCNewExtra-Spigot.jar \
            velocity/build/libs/GeyserMCNewExtra-Velocity.jar \
            bungee/build/libs/GeyserMCNewExtra-BungeeCord.jar \
            extension/build/libs/GeyserMCNewExtra-Extension.jar
